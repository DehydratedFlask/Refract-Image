[project]
name = "refract-image-backend"
version = "0.0.2"
description = "Local MLX inference service for Refract Image"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pillow>=10.0",
    "huggingface_hub>=0.24",
    "safetensors>=0.4",
    "python-multipart>=0.0.9",
    # Inference runtime. Not a hard requirement at import time: the service degrades to a
    # clearly-labelled mock runner when mflux is unavailable, which is what lets the UI be
    # developed and tested without a 9-33 GB model download.
    "mflux>=0.20",
    "mlx>=0.22",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["refract_backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
